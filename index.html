**營運後台 · PRODUCT REQUIREMENTS DOCUMENT**

代理後台｜下級報表｜v1.0｜2026-09-09

# 1. 這頁是什麼

下級報表是代理後台的業績對帳頁。代理用來查看自己線下各級下級代理，在指定結算日期區間內的有效投注、充值、淨輸贏、傭金差與應付傭金，並可匯出報表。

傭金模式由上級方案定型，下級繼承同一模式。本頁不提供模式 Tab 或模式欄位。預設方案示例為「有效投注額」，計算如下：

```text
傭金 = 該下級整條線有效投注 × 傭金差
傭金差 = max(自身比例 − 下級比例, 0)
```

頁面由三塊組成：

1. 搜尋範圍匯總
2. 搜尋條件
3. 下級列表（含匯出）

原型參考：`agent-subordinate-report.html`

# 2. 這頁不做什麼

| 不做的事 | 由誰負責 |
| --- | --- |
| 設定或修改傭金方案、返佣比例、結算週期類型 | 傭金方案設定（營運／總控） |
| 切換充值額／淨輸贏／有效投注等傭金模式 | 方案已定型，本頁只讀 |
| 展示首充、優惠、活動贈金、返水成本明細 | 不對代理開放 |
| 計算或展示 CPA／推薦傭金 | 若未來要做，獨立報表或獨立欄位 |
| 開戶、改比例、凍結下級、代充值 | 下級帳號管理 |
| 查看平級或上級線資料 | 權限中心；本頁強制只看自己線下 |
| 注單明細、充值明細、提現明細下鑽頁 | 對應明細頁（本版不做跳轉） |
| 舊制佔成、退水、交收、紅字滾存完整帳務 | 不在本版代理報表 |

# 3. 名詞說明

| 名詞 | 說明 |
| --- | --- |
| 直屬下級 | 相對當前登入代理只差一層、由其親自發展的下一層代理。 |
| 團隊／其他下級 | 直屬再往下發展的二級至五級代理。 |
| 整條線 | 該下級本人＋其團隊。本頁列上業績預設取整條線。 |
| 層級 | 相對當前登入代理：一級代理＝直屬，二級＝直屬再下一層，最多五級。不是全站絕對層級。 |
| 路徑 | 該下級註冊來源路徑，例如官網／邀請碼／上級鏈。 |
| 結算週期（查詢） | 本頁日期區間篩選，可選任意起始～結束日，可跨月。 |
| 方案結算週期 | 方案設定中的日結／週結／月結類型，本頁只讀展示，與查詢日期不是同一欄。 |
| 傭金模式 | 方案指定之計算基準：充值額、淨輸贏或有效投注額。上級定型後下級相同。 |
| 自身比例 | 當前登入代理在方案下的返佣比例。 |
| 下級比例 | 該列下級代理的返佣比例。 |
| 傭金差／極差 | 自身比例 − 下級比例，小於 0 時以 0 計。 |
| 有效投注 | 區間內、已歸戶之有效投注合計（和局、取消單是否計入跟方案）。 |
| 充值 | 區間內成功到帳充值，不含優惠／贈金。 |
| 淨輸贏 | 區間內會員輸贏結果；正負號需與方案一致。本頁展示但不作為模式切換。 |
| 傭金 | 依方案模式取對應業績 × 傭金差。 |
| 活躍玩家 | 查詢結果範圍內，區間中有產生有效投注的玩家 UID 去重人數。 |
| CPA | 按合格新客給固定單價，與本頁代理分成傭金分開計算，本版不做。 |

# 4. 畫面內容

| 區塊 | 內容 |
| --- | --- |
| 頁首 | 麵包屑：代理後台／報表中心／下級報表。標題：下級報表。右側只讀：方案模式、方案結算週期。不展示取數口徑。 |
| 搜尋範圍匯總 | 四張數字卡，隨目前篩選重算：有效投注、充值、傭金、活躍玩家。 |
| 搜尋條件 | 由左至右、可換行：代理UID（輸入）→ 路徑（輸入）→ 層級（多選下拉）→ 結算週期（區間元件）→ 搜尋／重置。右上顯示目前查詢區間。 |
| 結算週期元件 | 外層一條「起始日 ～ 結束日」。點開彈層：本週／本月／上月、雙月曆點選起迄、清除、確定。確定後才套用。 |
| 下級列表 | 表格＋合計列。右上：筆數、匯出報表。 |
| Toast | 匯出成功後畫面上方提示已匯出檔名，約 4 秒後消失。 |

搜尋列排序規則：

1. input 輸入（代理UID、路徑）
2. 下拉選單（層級）
3. Date 區間元件（結算週期）
4. 操作按鈕（搜尋、重置）

寬度不足時以「整組」換行，不可把日期元件拆散。

# 5. 欄位說明

| # | 欄位 | 內容 | 無資料時顯示 |
| --- | --- | --- | --- |
| 1 | 代理UID | 下級代理帳號／UID，本列主鍵。 | — |
| 2 | 層級 | 相對當前代理：一級代理～五級代理。 | — |
| 3 | 路徑 | 註冊來源路徑，過長省略並以 tooltip 顯示全文。 | — |
| 4 | 有效投注 | 該下級整條線、查詢區間內有效投注，兩位小數。 | 0.00 |
| 5 | 充值 | 該下級整條線成功到帳充值，兩位小數。 | 0.00 |
| 6 | 淨輸贏 | 該下級整條線會員輸贏，兩位小數，可為負。 | 0.00 |
| 7 | 自身比例 | 當前代理方案比例，如 1.20%。全表相同。 | 0.00% |
| 8 | 下級比例 | 該下級方案比例。 | 0.00% |
| 9 | 傭金差 | 自身比例 − 下級比例，最小 0。 | 0.00% |
| 10 | 傭金 | 依方案模式計算，兩位小數。 | 0.00 |
| 11 | 活躍玩家 | 該列線下區間內有有效投注之玩家數（列內）。匯總卡為跨列去重。 | 0 |

補充：

- 本頁不展示「類型」「首充」「優惠」。
- 層級儲存格只會是 `N級代理`，不會出現「玩家」。
- 匯總卡「傭金」跟方案模式；「有效投注」「充值」不隨模式改口徑。
- 活躍玩家不可把各列人數直接相加。

# 6. 狀態說明

| 值 | 顯示 | 意思 |
| --- | --- | --- |
| 方案模式＝有效投注額 | 頁首晶片「方案模式：有效投注額」 | 傭金＝有效投注 × 傭金差 |
| 方案模式＝充值額 | 頁首晶片「方案模式：充值額」 | 傭金＝充值 × 傭金差 |
| 方案模式＝淨輸贏 | 頁首晶片「方案模式：淨輸贏」 | 傭金依方案（通常僅在平台盈利／會員淨輸時計提） |
| 日結／週結／月結 | 頁首晶片「方案結算：×結」 | 方案結算節奏，不是搜尋日期 |
| 快捷＝本週 | 元件內按鈕高亮 | 當週週一 00:00:00～週日 23:59:59 |
| 快捷＝本月 | 元件內按鈕高亮 | 當月 1 日～當月最後一日 |
| 快捷＝上月 | 元件內按鈕高亮 | 上月 1 日～上月最後一日 |
| 自選區間 | 快捷不高亮 | 使用者在日曆點選之起始～結束 |

本週計算基準：以查詢當日為準，週起始為週一，週結束為週日。

# 7. 查詢、排序與分頁

| 欄位 | 型態 | 說明 |
| --- | --- | --- |
| 代理UID | 精確匹配 | 完整 UID 才命中。空白＝不限。僅搜自己線下。 |
| 路徑 | 模糊匹配 | 包含即可，不分大小寫。空白＝不限。 |
| 層級 | 多選下拉 | 一～五級代理。未選或全選＝一至五級都查。條件為 AND。 |
| 結算週期 | 日期區間 | 起始日不可晚於結束日。可跨月。快捷只帶入區間，不限制可選範圍。時區與後台結算時區一致（建議 UTC+8）。 |
| 預設條件 | 進頁即查 | 本週＋全部層級＋UID／路徑空白。 |
| 重置 | 按鈕 | 清空 UID、路徑；層級恢復五級全選；日期恢復本週；立即重查。 |
| 排序 | 本版 | 固定依層級升序、同層級依 UID。本版不做點表頭排序。 |
| 分頁 | 本版 | 原型一次列出結果。正式環境建議每頁 20／50，合計為「本次查詢總計」而非僅本頁。 |

# 8. 操作與跳轉

| 點擊位置 | 前往 | 帶入參數 |
| --- | --- | --- |
| 搜尋 | 停留本頁，重算匯總與列表 | 目前四個條件 |
| 重置 | 停留本頁，恢復預設條件並重查 | 無 |
| 結算週期觸發器 | 打開區間元件 | 帶入目前已套用起迄 |
| 本週／本月／上月 | 寫入元件暫存起迄，不立刻關閉 | 以查詢當日計算 |
| 日曆日期 | 第一次＝起始，第二次＝結束；若結束早於起始則對調 | 所點日期 |
| 清除 | 清空暫存起迄 | 無 |
| 確定 | 關閉元件並套用區間，重查 | 暫存起迄 |
| 匯出報表 | 下載 xlsx，Toast 4 秒 | 檔名：`下級報表_YYYYMMDD~YYYYMMDD.xlsx`，內容＝目前篩選結果 |
| 代理UID（本版） | 不跳轉 | 本版不做下鑽；後續若做，帶入該 UID 與同一日期區間 |

# 9. 頁面狀態

| 狀態 | 顯示方式 |
| --- | --- |
| 載入中 | 匯總與表格顯示載入中，禁止重複連點搜尋／匯出。 |
| 查詢成功有資料 | 匯總有數、表格列＋合計、筆數＝列數。 |
| 查詢成功無資料 | 匯總為 0；表格「查無符合條件的下級」。 |
| 起始日晚於結束日 | 不送查；表格提示「起始日不可晚於結束日」。 |
| 未選完整起迄即確定 | 確定無效，元件保持開啟。 |
| 無權限／非代理 | 不進本頁，或全頁無資料提示。 |
| 匯出成功 | 開始下載；Toast：`已匯出 下級報表_{起}~{迄}.xlsx`。 |
| 匯出時無區間 | Toast：`請先選擇結算週期再匯出`，不下載。 |

# 10. User Story — 使用者

| **US-U01 查看線下業績與傭金** |
| :--- |
| 身為代理，我要一次看到下級在指定區間的投注、充值與傭金，以便對帳。 |
| **GIVEN** |
| 我已登入代理後台，且方案已綁定傭金模式與比例。 |
| **WHEN** |
| 我進入下級報表（或調整條件後按搜尋）。 |
| **THEN** |
| 我只看到自己線下一至五級代理；匯總與列表數字一致；傭金按方案模式計算。 |

| **US-U02 用日期區間與快捷查資料** |
| :--- |
| 身為代理，我要查本週、本月、上月或自選跨月區間。 |
| **GIVEN** |
| 我在下級報表頁。 |
| **WHEN** |

| **THEN** |
| 查詢區間更新，匯總與列表按新區間重算；快捷鈕只存在元件內。 |

| **US-U03 匯出目前結果** |
| :--- |
| 身為代理，我要把目前篩選結果存成檔案。 |

# 11. User Story — 開發人員

| **US-D01 讀取方案而非在頁內切模式** |

| 身為開發人員，我要從傭金方案取模式、比例與結算類型，避免本頁再做模式 Tab。 |

| **US-Q03 驗證匯出與 Toast** |

# 13. 驗收標準

| ID | 主題 | 驗收敘述 |
| --- | --- | --- |
| AC-01 | 進頁預設 | Given 代理進入本頁；When 未改條件；Then 日期為本週週一至週日，層級視同五級全選，自動查出結果。 |
| AC-02 | UID 精確 | Given 輸入完整線下 UID；When 搜尋；Then 僅一列。Given 輸入不存在或線外 UID；Then 空表、匯總為 0。 |
| AC-03 | 路徑模糊 | Given 路徑關鍵字；When 搜尋；Then 路徑包含該字（不分大小寫）的下級均列出。 |
| AC-04 | 層級多選 | Given 只勾一級與三級；When 搜尋；Then 不含二、四、五級。 |
| AC-05 | 跨月日期 | Given 自選 8/1～9/30 並確定；When 查詢；Then 匯總與列表按該閉區間重算，可與本週數字不同。 |
| AC-06 | 快捷位置 | Given 查看結算週期；When 未打開元件；Then 外層看不到本週／本月／上月。打開後才出現在彈層內。 |
| AC-07 | 無模式切換 | Given 任何方案；When 使用本頁；Then 無 Tab、無傭金模式欄。 |
| AC-08 | 欄位 | Given 查看表頭與匯出；When 對照規格；Then 欄位為代理UID、層級、路徑、有效投注、充值、淨輸贏、自身比例、下級比例、傭金差、傭金、活躍玩家。無類型、首充、優惠。 |
| AC-09 | 層級文案 | Given 任一列；When 看層級；Then 僅「N級代理」，無玩家。 |
| AC-10 | 傭金公式 | Given 有效投注額方案；When 算一列；Then 傭金＝有效投注 × max(自身比例−下級比例, 0)，四捨五入至兩位。 |
| AC-11 | 活躍去重 | Given 兩列共享同一活躍玩家；When 看匯總活躍玩家；Then 該玩家只計 1，不等於兩列相加。 |
| AC-12 | 權限 | Given 代理 A；When 查詢；Then 永不出現非其線下、或超過相對五級之資料。 |
| AC-13 | 匯出 | Given 已有區間；When 匯出；Then 下載對應檔名 xlsx，Toast 顯示「已匯出 {檔名}」約 4 秒。 |
| AC-14 | 搜尋列排版 | Given 寬螢幕與窄螢幕；When 檢視搜尋列；Then 順序為輸入、下拉、日期、按鈕；不夠寬時整組換行，日期元件不被拆散。 |

# 14. 這頁需要的資料

| 需求 | 內容 |
| --- | --- |
| 登入代理 | UID、相對可看層級上限（本版固定 5）、生效方案 ID。 |
| 方案 | 模式（`validBet`／`deposit`／`pnl`）、結算類型（日／週／月）、自身返佣比例。 |
| 下級樹 | 線下一至五級代理 UID、層級、路徑、下級比例、狀態。 |
| 區間業績 | 每一下級整條線：有效投注、充值、淨輸贏、活躍玩家 UID 列表。 |
| 未結注單 | 是否計入由方案決定，本頁不另開開關，接口需回傳已按方案過濾後的數。 |
| 匯出 | 與列表相同欄位與目前篩選結果，檔名含區間。 |

建議接口參數：

```text
GET /agent/reports/subordinates
  uid            精確，可空
  path           模糊，可空
  levels[]       1-5，可空＝全部
  startDate      YYYY-MM-DD
  endDate        YYYY-MM-DD
```

  <script>
    const article = document.getElementById("article");
    const menu = document.getElementById("menu");
    const sidebar = document.getElementById("sidebar");
    const mask = document.getElementById("mask");

    function slugify(text, i) {
      return "sec-" + String(i).padStart(2, "0") + "-" + text.toLowerCase()
        .replace(/[^\w一-鿿]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function render(md) {
      if (window.marked) {
        marked.setOptions({ gfm: true, breaks: false });
        article.innerHTML = marked.parse(md);
      } else {
        article.innerHTML = "<pre>" + md.replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s])) + "</pre>";
        return;
      }

      const tocSkip = new Set(["目錄", "目录"]);
      const headings = [...article.querySelectorAll("h1, h2")];
      menu.innerHTML = "";
      headings.forEach((el, i) => {
        if (tocSkip.has(el.textContent.trim())) return;
        const id = slugify(el.textContent.trim(), i);
        el.id = id;
        const a = document.createElement("a");
        a.href = "#" + id;
        a.textContent = el.textContent.trim();
        a.className = el.tagName === "H2" ? "h2" : "h1";
        a.addEventListener("click", (e) => {
          e.preventDefault();
          document.getElementById(id).scrollIntoView({ behavior: "smooth", block: "start" });
          history.replaceState(null, "", "#" + id);
          sidebar.classList.remove("open");
          mask.classList.remove("show");
        });
        menu.appendChild(a);
      });

      const hash = decodeURIComponent(location.hash.replace("#", ""));
      if (hash) {
        const target = document.getElementById(hash);
        if (target) setTimeout(() => target.scrollIntoView({ block: "start" }), 50);
      }
      highlight();
    }

    function highlight() {
      const links = [...menu.querySelectorAll("a")];
      const heads = links.map(a => document.getElementById(a.getAttribute("href").slice(1))).filter(Boolean);
      let current = heads[0];
      const y = window.scrollY + 120;
      heads.forEach(h => { if (h.offsetTop <= y) current = h; });
      links.forEach(a => a.classList.toggle("active", current && a.getAttribute("href") === "#" + current.id));
    }

    async function boot() {
      let md = document.getElementById("md-source").textContent;
      try {
        const res = await fetch("prd-subordinate-report.md", { cache: "no-store" });
        if (res.ok) md = await res.text();
      } catch (e) {}
      render(md);
    }

    document.getElementById("menuBtn").addEventListener("click", () => {
      sidebar.classList.add("open");
      mask.classList.add("show");
    });
    mask.addEventListener("click", () => {
      sidebar.classList.remove("open");
      mask.classList.remove("show");
    });
    window.addEventListener("scroll", highlight, { passive: true });
    boot();
  </script>
